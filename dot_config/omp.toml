version = 3

# Catppuccin Mocha. Cambia solo estos valores para retematizar todo el prompt.
[palette]
  rosewater = '#f5e0dc'
  flamingo  = '#f2cdcd'
  pink      = '#f5c2e7'
  mauve     = '#cba6f7'
  red       = '#f38ba8'
  maroon    = '#eba0ac'
  peach     = '#fab387'
  yellow    = '#f9e2af'
  green     = '#a6e3a1'
  teal      = '#94e2d5'
  sky       = '#89dceb'
  sapphire  = '#74c7ec'
  blue      = '#89b4fa'
  lavender  = '#b4befe'
  text      = '#cdd6f4'
  subtext0  = '#a6adc8'
  overlay0  = '#6c7086'
  surface0  = '#313244'
  base      = '#1e1e2e'

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = ' {{ .Path }}'
    foreground = 'p:green'
    background = 'p:surface0'
    type = 'path'
    style = 'diamond'

    [blocks.segments.properties]
      cache_duration = 'none'
      style = 'mixed'

  [[blocks.segments]]
    leading_diamond = ' '
    trailing_diamond = ''
    template = ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
    foreground = 'p:teal'
    background = 'p:surface0'
    type = 'git'
    style = 'diamond'
    foreground_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}p:peach{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}', '{{ if gt .Ahead 0 }}p:mauve{{ end }}', '{{ if gt .Behind 0 }}p:mauve{{ end }}']

    [blocks.segments.properties]
      branch_max_length = 25.0
      cache_duration = 'none'
      fetch_stash_count = true
      fetch_status = true
      fetch_upstream_icon = true

  [[blocks.segments]]
    template = 'x '
    foreground = 'p:red'
    type = 'status'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'

[[blocks]]
  type = 'prompt'
  alignment = 'right'

  [[blocks.segments]]
    template = '{{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }} {{ .Full }}'
    foreground = 'p:green'
    type = 'node'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'files'
      fetch_package_manager = true
      fetch_version = true
      npm_icon = '<p:red> npm</> '
      yarn_icon = '<p:teal> yarn</> '

  [[blocks.segments]]
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    foreground = 'p:blue'
    type = 'crystal'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'files'
      fetch_version = true

  [[blocks.segments]]
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    foreground = 'p:maroon'
    type = 'ruby'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'files'
      fetch_version = true

  [[blocks.segments]]
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    foreground = 'p:yellow'
    type = 'python'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'context'
      fetch_virtual_env = false

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '➜ '
    foreground = 'p:green'
    type = 'text'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
